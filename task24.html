
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0784e8;
            color: white;
        }

        .nav-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            gap: 20px;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .links a {
            color: white;
            text-decoration: none;
            padding: 10px 12px;
            font-size: 14px;
        }

        .links a:first-child {
            background: #2197f5;
        }

        .menu-button {
            display: none;
            border: 0;
            background: transparent;
            color: white;
            font-size: 26px;
            cursor: pointer;
        }

        .mobile-links {
            display: none;
            background: #2b3e50;
            text-align: center;
            padding: 8px 0;
        }

        .mobile-links a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
        }

        .mobile-links a:first-child {
            color: #0784e8;
        }

        .mobile-links.show {
            display: block;
        }

        @media (max-width: 650px) {
            .nav-top {
                padding: 12px 16px;
            }

            .links {
                display: none;
            }

            .menu-button {
                display: block;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="nav-top">

            <div class="brand">CodingNepal</div>

            <div class="links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
                <a href="#">Feedback</a>
            </div>

            <button class="menu-button" id="menuButton">
                ☰
            </button>

        </div>

        <div class="mobile-links" id="mobileLinks">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <a href="#">Feedback</a>
        </div>

    </nav>

    <script>
        const menuButton = document.getElementById("menuButton");
        const mobileLinks = document.getElementById("mobileLinks");

        menuButton.addEventListener("click", function() {
            mobileLinks.classList.toggle("show");
        });
    </script>

</body>
</html>
