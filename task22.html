
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Navbar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .game-nav {
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: #585a8b;
            color: white;
            padding: 15px 20px;
            border-radius: 9px;
        }

        .logo {
            font-size: 36px;
        }

        .links {
            display: flex;
            gap: 22px;
        }

        .links a {
            color: #d9f4ff;
            text-decoration: none;
            font-size: 14px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            white-space: nowrap;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #e6c3a6;
            color: #333;
            display: grid;
            place-items: center;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            .game-nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            .links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 14px;
            }

            .profile {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="game-nav">

        <div class="logo">🎮</div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">Team</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

        <div class="profile">
            <span>Hello, John Doe</span>
            <div class="avatar">JD</div>
        </div>

    </nav>

</body>
</html>
