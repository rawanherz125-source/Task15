<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; padding: 20px; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 100px;
    gap: 8px;
  }
  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .g1 { grid-column: 1 / 4;  grid-row: 1 / 3; } 
  .g2 { grid-column: 4;      grid-row: 1; }      
  .g3 { grid-column: 4;      grid-row: 2; }     
  .g4 { grid-column: 1 / -1; }                  
  .g5 { grid-row: span 2; }                      
  .g6 { grid-column: 2 / -1; }                  


  
  @media (max-width: 600px) {
    .gallery { grid-template-columns: 1fr; }
    .gallery img {
      grid-column: auto !important;
      grid-row: auto !important;
      height: 200px;
    }
  }
</style>
</head>
<body>
  <div class="gallery">
    <img class="g1" src="img1.jpg" alt="">
    <img class="g2" src="img2.jpg" alt="">
    <img class="g3" src="img3.jpg" alt="">
    <img class="g4" src="img4.jpg" alt="">
    <img class="g5" src="img5.jpg" alt="">
    <img class="g6" src="img6.jpg" alt="">
    <img class="g7" src="img7.jpg" alt="">
    <img class="g8" src="img8.jpg" alt="">
    <img class="g9" src="img1.jpg" alt="">
  </div>
</body>
</html>
